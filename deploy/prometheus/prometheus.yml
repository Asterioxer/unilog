# Prometheus Scrape Configuration for unilog Telemetry Subsystem
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "unilog-api"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["unilog-api:8002"]
        labels:
          environment: "local-docker"
          service: "unilog-backend"

  - job_name: "unilog-api-production"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets: ["unilog-w9oe.onrender.com"]
        labels:
          environment: "production"
          service: "unilog-backend"
