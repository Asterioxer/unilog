# Prometheus Scrape Configuration for unilog Telemetry Subsystem
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "unilog-api"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets: ["unilog-w9oe.onrender.com"]
        labels:
          environment: "production"
          service: "unilog-backend"
